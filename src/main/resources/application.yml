# BMDExpress Web Configuration
# Default values for filters and visibility

bmdexpress:
  defaults:
    primary-filter:
      percentage-min: 5
      genes-passed-filters-min: 3
      all-genes-min: 40
      all-genes-max: 500
    visibility:
      default-state: normal    # normal | highlighted | dimmed | hidden
      default-size: medium     # small | medium | large
    display-mode:
      non-selected: dimmed     # How to display non-selected items: normal | dimmed | hidden

# Vocabulary Configuration
# These values can be extended or overridden for custom deployments

vocabulary:
  providers:
    - Affymetrix
    - Agilent
    - BioSpyder
    - RefSeq
    - Ensembl
    - Clinical Endpoint
    - Generic

  platforms:
    # Affymetrix platforms
    - Affymetrix Drosophila Genome Array
