# BMDExpress Web Configuration
# Default values for filters and visibility

bmdexpress:
  reports:
    dir: data/reports
    max-size-mb: 50
  llm:
    default-provider: claude
    default-temperature: 0.3
    default-max-tokens: 4096
    timeout-seconds: 120
  defaults:
    primary-filter:
      percentage-min: 5
      genes-passed-filters-min: 3
      all-genes-min: 40
      all-genes-max: 500
    visibility:
      default-state: normal    # normal | highlighted | dimmed | hidden
      default-size: medium     # small | medium | large
    display-mode:
      non-selected: dimmed     # How to display non-selected items: normal | dimmed | hidden
