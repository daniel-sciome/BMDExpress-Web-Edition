backend:
  name: github
  repo: daniel-sciome/BMDExpress-Web-Edition
  branch: main
  base_url: https://decap-oauth.netlify.app

publish_mode: editorial_workflow
media_folder: "docs/assets/images"
public_folder: "assets/images"
site_url: https://daniel-sciome.github.io/BMDExpress-Web-Edition

collections:
  - name: "docs"
    label: "Documentation Pages"
    folder: "docs"
    create: false
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Navigation Order", name: "nav_order", widget: "number" }
      - { label: "Content", name: "body", widget: "markdown" }
    filter:
      field: "nav_order"
      value: ""
      # This ensures only files with nav_order are shown

  - name: "pages"
    label: "All Pages"
    files:
      - label: "Home"
        name: "index"
        file: "docs/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "Overview of the Main View"
        name: "overview"
        file: "docs/overview.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "How to Use the Application"
        name: "how-to-use"
        file: "docs/how-to-use-the-application.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "Statistical Prefiltering"
        name: "prefiltering"
        file: "docs/prefiltering.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "Benchmark Dose Analysis"
        name: "benchmark-dose"
        file: "docs/benchmark-dose-analysis.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "Functional Classifications"
        name: "functional-classifications"
        file: "docs/functional-classifications.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Navigation Order", name: "nav_order", widget: "number" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "GCurveP"
        name: "gcurvep"
