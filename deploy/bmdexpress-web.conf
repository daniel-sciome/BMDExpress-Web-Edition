# ============================================================================
# BMDExpress Web Edition — environment configuration
# ============================================================================
# Purpose:
#   This file is loaded by the systemd service (via EnvironmentFile=) and
#   defines environment variables that control the JVM and application
#   behavior. Edit this file to tune memory, change the port, or pass
#   additional Spring Boot properties — no need to touch the .service file.
#
# Syntax:
#   KEY=value (no spaces around '=', no 'export' keyword)
#   Lines starting with '#' are comments.
#
# After editing, restart the service:
#   sudo systemctl restart bmdexpress-web
# ============================================================================

# --- JVM Options ---
# -Xmx1536m : max heap — matches the Docker deployment's 1536 MB allocation.
#              Adjust based on available RAM. The app uses an embedded H2
#              database and can hold large dose-response datasets in memory.
# -Xms512m  : initial heap — pre-allocates 512 MB to reduce GC pauses at
#              startup when loading library data.
JAVA_OPTS=-Xmx1536m -Xms512m

# --- Server Port ---
# The Spring Boot app reads this via ${PORT:8080} in application.properties.
# Port 8080 is taken by another service (jsvc), so we use 8081
PORT=8081

# --- Additional Application Options ---
# Passed directly to the Spring Boot JAR after the -jar flag.
# Use this for Spring property overrides, e.g.:
#   APP_OPTS=--spring.profiles.active=production --server.port=9090
# No longer needed — .bm2 files are bundled into the JAR at build time,
# so the default classpath:data/bmd location works.
APP_OPTS=
